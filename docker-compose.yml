services:
  postgres:
    image: postgres:16-alpine
    container_name: komo-art-db
    restart: unless-stopped
    ports:
      # Port hôte surchargeable via POSTGRES_PORT dans .env (défaut 5432)
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-komo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-komo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-komo_art}
    volumes:
      - komo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-komo} -d ${POSTGRES_DB:-komo_art}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  komo_pgdata:
